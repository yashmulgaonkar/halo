# System: ESP32-S3 core + memory stack
# Extracted for optional packaging; default Halo-v1 profile always includes this.
# Memory options adapted from community modular work (PSRAM / mbedTLS / TCP / WDT).

logger:
  level: WARN
  baud_rate: 0
  logs:
    wifi: NONE
    esp-idf: NONE
    esp32.preferences: NONE
    api: NONE
    api.connection: NONE
    web_server: NONE
    component: ERROR
    light: WARN

psram:
  mode: octal
  # Octal PSRAM max is 80MHz (120MHz needs non-octal / experimental — see
  # github.com/yashmulgaonkar/halo/issues/17). CPU stays at 240MHz below.
  speed: 80MHz

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      loop_task_stack_size: 24576
    sdkconfig_options:
      # Prefer PSRAM for larger heap allocations (LVGL, TLS, HTTP).
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_SPIRAM_MEMTEST: "n"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_ESP32_WIFI_RX_BA_WIN: "16"
      CONFIG_ESP32_WIFI_CACHE_TX_BUFFER_NUM: "32"
      # Larger TCP windows help HA API / future weather JSON / history flush.
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65535"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_RECVMBOX_SIZE: "32"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "256"
      CONFIG_LWIP_TCP_MSS: "1436"
      CONFIG_LWIP_TCP_OVERSIZE_MSS: "y"
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # Wi-Fi hot path in IRAM (coexists better with NeoPixel bitbang).
      CONFIG_ESP32_WIFI_IRAM_OPT: "y"
      CONFIG_ESP32_WIFI_RX_IRAM_OPT: "y"

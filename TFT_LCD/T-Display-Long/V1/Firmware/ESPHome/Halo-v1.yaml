esphome:
  name: halo-v1
  friendly_name: Halo Air Quality Sensor
  name_add_mac_suffix: true
  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: qio
    board_build.psram_type: opi
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

  # model: sen55 and related packages require 2026.7.2+
  min_version: 2026.7.2

  project:
    name: "yashmulgaonkar.Halo-v1"
    version: "${version}"

# SK68XX ring driver (repo-root components/ws2812_bitbang). Local path for
# USB/CI builds from this directory; HA leaf installs use github:// — see PACKAGES.md.
external_components:
  - source:
      type: local
      path: ../../../../../components
    components: [ws2812_bitbang]

dashboard_import:
  package_import_url: github://yashmulgaonkar/halo/TFT_LCD/T-Display-Long/V1/Firmware/ESPHome/Halo-v1.yaml@main
  import_full_config: true

# OTA is intentionally omitted here: ESPHome device YAMLs already define
# `ota` with id: ota_default. Re-declaring it causes "ID ota_default redefined".

wifi:
  # Disable modem sleep — QSPI/AMOLED panels can blank after long uptime with default power save.
  power_save_mode: none
  use_psram: true

  on_connect:
    - delay: 5s # Gives time for improv results to be transmitted

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Halo Hotspot"

# ============================================================================
# Package profile — default = full HALO
#
# Local/CI: sibling !include (this file).
# HA dashboard: see PACKAGES.md — list each package file ONCE.
# Never list both Halo-v1.yaml and Halo-v1-Core.yaml in the same remote
# files: list (duplicates Core → "Startup Light Blink" conflict).
# ============================================================================
packages:
  globals: !include packages/base/globals.yaml
  system_core: !include packages/system/esphome_core.yaml

  # BLE improv (Bluedroid) contends with Wi-Fi during NeoPixel updates.
  # Stub is the release default; swap to ble_improv when you need provisioning.
  # ble: !include packages/features/ble/ble_improv.yaml
  ble: !include packages/features/ble/ble_stub.yaml

  airq_history: !include packages/features/airq/airq_history.yaml
  page_rotation: !include packages/features/page_rotation/page_rotation.yaml
  ota_channel: !include packages/features/ota/ota_channel.yaml

  # Optional (off by default):
  # weather: !include packages/features/weather/weather_ha.yaml
  # wireguard: !include packages/features/wireguard/wireguard.yaml

  core: !include Halo-v1-Core.yaml

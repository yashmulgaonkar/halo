esphome:
  name: halo-v1
  friendly_name: Halo Air Quality Sensor
  name_add_mac_suffix: true
  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: qio
    board_build.psram_type: opi
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

  min_version: 2025.6.2

  project:
    name: "yashmulgaonkar.Halo-v1"
    version: "${version}"

dashboard_import:
  package_import_url: github://yashmulgaonkar/halo/TFT_LCD/T-Display-Long/V1/Firmware/ESPHome/Halo-v1.yaml@main
  import_full_config: true

# OTA is intentionally omitted here: ESPHome device YAMLs already define
# `ota` with id: ota_default. Re-declaring it causes "ID ota_default redefined".

wifi:
  # Disable modem sleep — QSPI/AMOLED panels can blank after long uptime with default power save.
  power_save_mode: none

  on_connect:
    - delay: 5s # Gives time for improv results to be transmitted

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Halo Hotspot"

packages:
  # Sibling include so CI / branch imports use the Core from the same ref (not hard-coded main).
  core: !include Halo-v1-Core.yaml

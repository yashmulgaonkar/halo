esphome:
  name: halo_epd
  friendly_name: Halo Air Quality Sensor EPD
  name_add_mac_suffix: true
  platformio_options:
    upload_speed: 921600
    build_unflags: -Werror=all
    board_build.flash_mode: dio
    board_build.f_flash: 40000000L
    board_build.f_cpu: 240000000L

  min_version: 2025.2.0

  project:
    name: "yashmulgaonkar.Halo_EPD"
    version: "${version}"

dashboard_import:
  package_import_url: github://yashmulgaonkar/halo/E-Paper/Waveshare_BWR/V1/Firmware/ESPHome/Halo_EPD.yaml@main
  import_full_config: true

# OTA is intentionally omitted here: ESPHome device YAMLs already define
# `ota` with id: ota_default. Re-declaring it causes "ID ota_default redefined".

wifi:
  on_connect:
    - delay: 5s # Gives time for improv results to be transmitted

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Halo Hotspot"

packages:
  # Sibling include so CI / branch imports use the Core from the same ref (not hard-coded main).
  core: !include Halo_EPD-Core.yaml

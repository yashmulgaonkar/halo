name: Build and Release Halo TFT LCD Firmware

env:
  DEVICE_NAME: halo
  CHIP_FAMILY: ESP32-S3

on:
  push:
    paths:
      - 'TFT_LCD/**'
      - 'TFT_LCD_LVGL/**'
      - '.github/workflows/tft_lcd_ota-update.yml'
      - 'static/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (leave empty to use Core.yaml)'
        required: false
        default: ''

jobs:
  get-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: resolve
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version=$(awk '/substitutions:/ {found=1} found && /version:/ {print $2; exit}' \
              TFT_LCD/T-Display-Long/V1/Firmware/ESPHome/Halo-v1-Core.yaml | tr -d '"')
          fi
          if [ -z "${version}" ]; then
            echo "Error: Could not resolve firmware version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

  get-lvgl-version:
    name: Resolve LVGL Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: resolve
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*HALO_FW_VERSION "\([^"]*\)".*/\1/p' \
            TFT_LCD_LVGL/T-Display-Long/V1/Firmware/include/halo_version.h)
          if [ -z "${version}" ]; then
            echo "Error: Could not resolve LVGL firmware version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved LVGL version: ${version}"

  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: get-version
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install "esphome==2026.7.2"

      - name: Build Firmware
        working-directory: TFT_LCD/T-Display-Long/V1/Firmware/ESPHome
        run: |
          set -euo pipefail
          # Halo-v1.yaml !includes Halo-v1-Core.yaml from this checkout (branch/commit under test).
          esphome compile Halo-v1.yaml
          echo "Firmware binaries:"
          find .esphome -type f -name '*.bin' -print

      - name: Collect Firmware Artifacts
        working-directory: TFT_LCD/T-Display-Long/V1/Firmware/ESPHome
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Prefer ESPHome output layout; fall back to PlatformIO envs.
          mapfile -t bins < <(find .esphome -type f \( -name 'firmware.factory.bin' -o -name 'firmware.bin' -o -name 'firmware.ota.bin' \) | sort)
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "ERROR: No firmware binaries found under .esphome"
            find .esphome -type f | head -n 200 || true
            exit 1
          fi
          for f in "${bins[@]}"; do
            cp -v "$f" "artifacts/$(basename "$f")"
          done
          ls -la artifacts

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-tft
          path: TFT_LCD/T-Display-Long/V1/Firmware/ESPHome/artifacts/*
          if-no-files-found: error

  build-lvgl:
    name: Build LVGL Firmware
    runs-on: ubuntu-latest
    needs: get-lvgl-version
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            TFT_LCD_LVGL/T-Display-Long/V1/Firmware/.pio/libdeps
          key: ${{ runner.os }}-pio-lvgl-${{ hashFiles('TFT_LCD_LVGL/T-Display-Long/V1/Firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-lvgl-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build and merge a USB image
        working-directory: TFT_LCD_LVGL/T-Display-Long/V1/Firmware
        run: |
          set -euo pipefail
          pio run
          BUILD=".pio/build/halo-tdisplay-s3-long"
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n1)"
          ESPTOOL="$(find "$HOME/.platformio/packages/tool-esptoolpy" -name esptool.py | head -n1)"
          if [ -z "${BOOT_APP0}" ] || [ -z "${ESPTOOL}" ]; then
            echo "ERROR: Could not find boot_app0.bin or esptool.py"
            exit 1
          fi
          python "$ESPTOOL" --chip esp32s3 merge_bin -o "$BUILD/firmware.factory.bin" \
            --flash_mode qio --flash_freq 80m --flash_size 16MB \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"
          mkdir -p artifacts
          cp -v "$BUILD/firmware.factory.bin" artifacts/firmware.factory.bin
          ls -la artifacts

      - name: Upload LVGL Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-lvgl
          path: TFT_LCD_LVGL/T-Display-Long/V1/Firmware/artifacts/*
          if-no-files-found: error

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./static
          destination: ./output

      - name: Upload Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: output

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - get-version
      - build-firmware
    permissions:
      contents: write
    steps:
      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-tft
          path: firmware

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          body: Auto-generated TFT LCD firmware release from GitHub Actions.
          files: firmware/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-lvgl-release:
    name: Create LVGL GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - get-lvgl-version
      - build-lvgl
    permissions:
      contents: write
    steps:
      - name: Download LVGL Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-lvgl
          path: firmware-lvgl

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lvgl-${{ needs.get-lvgl-version.outputs.version }}
          name: LVGL ${{ needs.get-lvgl-version.outputs.version }}
          body: Browser-flash image for the LVGL T-Display-Long firmware. The same file is on the installer.
          files: firmware-lvgl/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - get-version
      - get-lvgl-version
      - build-firmware
      - build-lvgl
      - build-site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-tft
          path: output/firmware

      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: output

      - name: Download LVGL Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-lvgl
          path: output/firmware-lvgl

      - name: Generate Firmware Manifest
        working-directory: output/firmware
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          DEVICE: ${{ env.DEVICE_NAME }}
          CHIP_FAMILY: ${{ env.CHIP_FAMILY }}
        run: |
          set -euo pipefail

          echo "Firmware tree:"
          find . -type f -print | sed 's|^\./||'

          FACTORY="$(find . -type f -name '*.factory.bin' | head -n1 || true)"
          if [ -z "${FACTORY}" ]; then
            FACTORY="$(find . -type f -name '*.bin' ! -name '*.ota.bin' | head -n1 || true)"
          fi

          OTA="$(find . -type f -name '*.ota.bin' | head -n1 || true)"
          if [ -z "${OTA}" ]; then
            OTA="$(find . -type f -name 'firmware.bin' | head -n1 || true)"
          fi

          if [ -z "${FACTORY}" ]; then
            echo "ERROR: No factory (or fallback) .bin found for manifest."
            exit 1
          fi
          if [ -z "${VERSION}" ]; then
            echo "ERROR: VERSION is empty; refuse to publish blank manifest version."
            exit 1
          fi

          FACTORY_REL="${FACTORY#./}"
          OTA_REL="${OTA#./}"
          OTA_MD5=""
          if [ -n "${OTA}" ] && [ -f "${OTA}" ]; then
            OTA_MD5="$(md5sum "${OTA}" | awk '{print $1}')"
          fi

          {
            echo '{'
            echo '  "name": "'"${DEVICE}"'.TFT-LCD",'
            echo '  "version": "'"${VERSION}"'",'
            echo '  "home_assistant_domain": "esphome",'
            echo '  "new_install_prompt_erase": false,'
            echo '  "builds": ['
            echo '    {'
            echo '      "chipFamily": "'"${CHIP_FAMILY}"'",'
            if [ -n "${OTA_REL}" ]; then
              echo '      "ota": {'
              echo '        "path": "'"${OTA_REL}"'",'
              [ -n "${OTA_MD5}" ] && echo '        "md5": "'"${OTA_MD5}"'",'
              echo '        "summary": ""'
              echo '      },'
            fi
            echo '      "parts": ['
            echo '        { "path": "'"${FACTORY_REL}"'", "offset": 0 }'
            echo '      ]'
            echo '    }'
            echo '  ]'
            echo '}'
          } > manifest.json

          echo "Generated manifest.json:"
          cat manifest.json

      - name: Generate LVGL Firmware Manifest
        working-directory: output/firmware-lvgl
        env:
          VERSION: ${{ needs.get-lvgl-version.outputs.version }}
          CHIP_FAMILY: ${{ env.CHIP_FAMILY }}
        run: |
          set -euo pipefail
          if [ ! -f firmware.factory.bin ]; then
            echo "ERROR: firmware.factory.bin is missing"
            find . -type f -print
            exit 1
          fi
          if [ -z "${VERSION}" ]; then
            echo "ERROR: LVGL VERSION is empty"
            exit 1
          fi
          {
            echo '{'
            echo '  "name": "HALO LVGL",'
            echo '  "version": "'"${VERSION}"'",'
            echo '  "new_install_prompt_erase": true,'
            echo '  "builds": ['
            echo '    {'
            echo '      "chipFamily": "'"${CHIP_FAMILY}"'",'
            echo '      "parts": ['
            echo '        { "path": "firmware.factory.bin", "offset": 0 }'
            echo '      ]'
            echo '    }'
            echo '  ]'
            echo '}'
          } > manifest.json
          echo "Generated LVGL manifest.json:"
          cat manifest.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
